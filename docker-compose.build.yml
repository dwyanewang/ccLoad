services:
  ccload:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 版本号：用于静态资源缓存控制
        # - dev（默认）：开发环境，静态资源不缓存
        # - v1.x.x：生产环境，静态资源长缓存
        # 生产构建: VERSION=$(git describe --tags --always) docker compose -f docker-compose.build.yml build
        VERSION: ${VERSION:-dev}
    # 同步发布脚本会注入不可变 CCLOAD_IMAGE_TAG；手工本地构建仍沿用 local。
    image: ccload:${CCLOAD_IMAGE_TAG:-local}
    # 始终基于当前工作区源码构建，不拉取远程发布镜像。
    pull_policy: build
    container_name: ccload
    # 确保新建的宿主机绑定目录可写，与预构建镜像的 Compose 配置保持一致。
    user: root
    restart: unless-stopped
    # 直接使用宿主机网络，避免 TUN 代理接管 Docker DNAT 后的容器流量。
    network_mode: host
    # 配置与运行数据统一放在 CCLOAD_DEPLOY_DIR 指定的项目外部目录。
    # 文件不存在时 Compose 直接报错拒绝启动，不会用弱默认密码跑起来。
    env_file:
      - "${CCLOAD_DEPLOY_DIR:?set CCLOAD_DEPLOY_DIR}/.env"
    environment:
      # environment 的优先级高于 env_file，确保服务直接监听宿主机 8808 端口。
      PORT: "8808"
    volumes:
      # 宿主机路径由部署环境传入，Compose 文件不绑定机器或目录层级。
      - type: bind
        source: "${CCLOAD_DEPLOY_DIR:?set CCLOAD_DEPLOY_DIR}/data"
        target: /app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8808/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
